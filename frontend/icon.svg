<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101412"/>
      <stop offset="100%" stop-color="#0a0c0b"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="#2d3c34" stroke-width="8"/>

  <!-- Radar Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#22c55e" stroke-width="4" stroke-opacity="0.45"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#22c55e" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="#22c55e" stroke-width="3" stroke-opacity="0.75"/>

  <!-- Crosshairs -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#38e1ff" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="46" y1="256" x2="466" y2="256" stroke="#38e1ff" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Radar Sweep -->
  <path d="M 256 256 L 397 114 A 200 200 0 0 1 456 256 Z" fill="url(#sweepGrad)"/>

  <!-- Target Blips -->
  <circle cx="360" cy="160" r="10" fill="#38e1ff"/>
  <circle cx="360" cy="160" r="18" fill="none" stroke="#38e1ff" stroke-width="2" stroke-opacity="0.7"/>

  <circle cx="160" cy="350" r="9" fill="#ff4d4d"/>
  <circle cx="160" cy="350" r="16" fill="none" stroke="#ff4d4d" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Center Delta Marker -->
  <polygon points="256,196 296,296 256,276 216,296" fill="#ff9f0a" stroke="#ffffff" stroke-width="4"/>
</svg>
