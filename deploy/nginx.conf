# ==============================================================================
# TACMAP Nginx Reverse Proxy Configuration (Debian 13 LXC / Production)
# ==============================================================================

# Зони обмеження частоти запитів (Rate Limiting проти DoS та скрапінгу)
limit_req_zone $binary_remote_addr zone=tacmap_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tacmap_ws:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=tacmap_static:10m rate=30r/s;

# Upstream бекенда Rust (Release: порт 8080)
upstream tacmap_backend {
    server 127.0.0.1:8080 max_fails=0;
    keepalive 64;
}

# Upstream бекенда Rust (Beta: порт 8081 — ізольований тестовий контур)
upstream tacmap_beta_backend {
    server 127.0.0.1:8081 max_fails=0;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name tacmap.yunexal.com localhost _;
    absolute_redirect off;

    # Визначення реального IP відвідувача від Cloudflare
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Корінь статичних файлів
    root /opt/tacmap/frontend;
    index index.html;

    # Максимальний розмір тіла запиту
    client_max_body_size 2M;

    # Gzip стиснення для масивних GeoJSON та JS
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/geo+json
        application/manifest+json
        image/svg+xml;

    # Глобальні заголовки безпеки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Блокування прихованих файлів, конфігів та баз даних (.git, .env, *.db)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sqlite|db|env|bak|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Блокування типових ботів-сканерів вразливостей (wp-admin, phpmyadmin тощо)
    location ~* (wp-login|wp-admin|phpmyadmin|admin|actuator|eval-stdin) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 1. API ендпоінти (Проєкт закрито)
    location /api/ {
        return 404;
    }

    # 1.2. Юридична згода та криптопідпис (Вимкнено)
    location = /api/consent {
        return 404;
    }

    # 2. WebSocket ендпоінти (Проєкт закрито)
    location /ws/ {
        return 404;
    }

    # 3. PWA Service Worker (ніколи не кешувати довго)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri @backend;
    }

    # 4. PWA Manifest та іконки
    location ~* \.(webmanifest|json|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @backend;
    }

    # 5. Перенаправлення застарілих /live та /live/ на корінь /
    location ~ ^/live/?$ {
        return 301 /;
    }

    # 5.1. Офіційне повідомлення про закриття експериментального контуру Beta
    location = /beta {
        return 301 /beta/;
    }

    location /beta/ {
        limit_req zone=tacmap_static burst=50 nodelay;
        alias /opt/tacmap_beta/frontend/;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /beta/index.html =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # 6. Статичний веб-інтерфейс (Проєкт закрито)
    location / {
        limit_req zone=tacmap_static burst=50 nodelay;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html =404;
    }
}
